# Windows-specific overrides
version: '3.8'

services:
  telegraf:
    image: telegraf:1.30
    container_name: telegraf
    restart: unless-stopped
    environment:
      - HOST_PROC=C:\\Windows\\System32\\wbem\\en-US\\
      - HOST_SYS=C:\\Windows\\System32
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - TELEGRAF_TOKEN=${TELEGRAF_TOKEN}
    ports:
      - "9273:9273"
    volumes:
      - ${PWD}/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:rw
      # Docker socket omitted on Windows as it's not needed
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "tasklist", "/FI", "IMAGENAME eq telegraf.exe"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
