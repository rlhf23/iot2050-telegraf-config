# Load environment variables from .env file in the same directory as docker-compose.yml
# This makes all variables available in the docker-compose file

services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    env_file:
      - .env
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - ./config/influxdb/init-influxdb.sh:/docker-entrypoint-initdb.d/init-influxdb.sh
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}
      - TELEGRAF_TOKEN=${TELEGRAF_TOKEN}
      - INFLUXD_HTTP_BIND_ADDRESS=:8086
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  telegraf:
    build:
      context: .
      dockerfile: Dockerfile.telegraf
      args:
        - TELEGRAF_SSH_PASSWORD=${TELEGRAF_SSH_PASSWORD}
    env_file:
      - .env
    container_name: telegraf
    user: "telegraf:${HOST_DOCKER_GID}"  # Use host's docker group ID from environment
    restart: unless-stopped
    environment:
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - TELEGRAF_SSH_PASSWORD=${TELEGRAF_SSH_PASSWORD:?TELEGRAF_SSH_PASSWORD must be set}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - TELEGRAF_TOKEN=${TELEGRAF_TOKEN}
    ports:
      - "2222:22"  # Expose SSH port
    volumes:
      - ./config/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:rw
      - /var/run/docker.sock:/var/run/docker.sock:rw  # Changed to rw for Docker access
      - /sys:/host/sys:ro
      - /proc:/host/proc:ro
      - /etc:/host/etc:ro
      - /var/run/utmp:/var/run/utmp:ro
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "telegraf", "--test"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - influxdb
    networks:
      - monitoring
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge

volumes:
  influxdb_data:
  grafana_data:
