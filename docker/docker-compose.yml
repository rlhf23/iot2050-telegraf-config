# Load environment variables from .env file in the same directory as docker-compose.yml
# This makes all variables available in the docker-compose file
#
# TARGETARCH: Set this environment variable to select the api-service binary architecture
#   - arm64 (default): For ARM64 devices (IoT2050, Raspberry Pi, etc.)
#   - amd64: For x86_64 devices (servers, VMs, etc.)
# Example: TARGETARCH=amd64 docker-compose up -d

services:
  influxdb:
    image: influxdb:2
    container_name: influxdb
    env_file:
      - .env
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}
      - TELEGRAF_TOKEN=${TELEGRAF_TOKEN}
      - INFLUXDB_DIAGNOSTICS_BUCKET=${INFLUXDB_DIAGNOSTICS_BUCKET}
      - INFLUXD_LOGGING_LEVEL=warn
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  influxdb-setup:
    image: influxdb:2
    container_name: influxdb-setup
    depends_on:
      influxdb:
        condition: service_healthy
    env_file:
      - .env
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Creating diagnostics bucket: $$INFLUXDB_DIAGNOSTICS_BUCKET"
        influx bucket create \
          --host http://influxdb:8086 \
          -n "$$INFLUXDB_DIAGNOSTICS_BUCKET" \
          -o "$$INFLUXDB_ORG" \
          -r 0 \
          --token "$$INFLUXDB_TOKEN" \
        && echo "✅ Bucket created" \
        || echo "⚠️ Bucket may already exist or creation failed"
    networks:
      - monitoring
    restart: "no"

  telegraf:
    image: telegraf:1.30 # Using a specific version for stability
    env_file:
      - .env
    container_name: telegraf
    # user: "telegraf:${HOST_DOCKER_GID}"  # Use host's docker group ID from environment
    restart: unless-stopped
    ports:
      - "9273:9273"  # Prometheus metrics endpoint
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    environment:
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - INFLUXDB_DIAGNOSTICS_BUCKET=${INFLUXDB_DIAGNOSTICS_BUCKET}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - TELEGRAF_TOKEN=${TELEGRAF_TOKEN}
      - HOST_DOCKER_GID=${HOST_DOCKER_GID}
    volumes:
      - ${HOME}/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - ./config/telegraf/telegraf.conf.minimal:/etc/telegraf/telegraf.conf.minimal:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /etc:/host/etc:ro
      - /var/run/utmp:/var/run/utmp:ro
    command: >
      sh -c "if [ ! -f /etc/telegraf/telegraf.conf ]; then
               echo 'No telegraf.conf found, using minimal config...';
               cp /etc/telegraf/telegraf.conf.minimal /etc/telegraf/telegraf.conf;
             fi &&
             telegraf"
    networks:
      monitoring:
        aliases:
          - telegraf
    healthcheck:
      test: ["CMD", "pgrep", "telegraf"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    depends_on:
      - influxdb
      - prometheus
    networks:
      - monitoring
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    user: root
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./config/prometheus:/etc/prometheus
      - /etc/localtime:/etc/localtime:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.external-url=/prometheus'
      - '--web.route-prefix=/'
    restart: unless-stopped
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  api-service:
    build:
      context: .
      dockerfile: api-service/Dockerfile.prebuilt
      args:
        - TARGETARCH=${TARGETARCH:-arm64}
    container_name: api-service
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOME}/telegraf:/telegraf
    environment:
      - TELEGRAF_CONFIG_PATH=/telegraf/telegraf.conf
      - GRAFANA_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GRAFANA_URL=http://grafana:3000
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  control-service:
    build:
      context: .
      dockerfile: control-service/Dockerfile.prebuilt
      args:
        - TARGETARCH=${TARGETARCH:-arm64}
    container_name: control-service
    ports:
      - "8002:8002"
    volumes:      - ./config/control:/config/control:ro
    environment:
      - CONTROL_CONFIG=/config/control/config.toml
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8002/api/control/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: nginx-dashboard
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/html:/usr/share/nginx/html
      - ./config/nginx/scripts/system-info.sh:/usr/local/bin/system-info.sh:ro
      - ./config/nginx/scripts/start-nginx.sh:/usr/local/bin/start-nginx.sh:ro
      - ${HOME}/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro 
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - grafana
      - influxdb
      - prometheus
      - telegraf
      - api-service
      - control-service
    networks:
      - monitoring
    restart: unless-stopped
    command: /bin/sh /usr/local/bin/start-nginx.sh
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  monitoring:
    driver: bridge

volumes:
  influxdb_data:
  grafana_data:
  prometheus_data:
