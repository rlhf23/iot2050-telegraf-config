# Namespace for file folder_sample_db: 2

##################################

# Global tags can be specified here in key="value" format.
[global_tags]

# Configuration for telegraf agent
[agent]
  ## Default data collection interval for all inputs
  interval = "1000ms"
  round_interval = true

  metric_batch_size = 10000
  metric_buffer_limit = 100000

  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "0s"

  ## Log at debug level.
  # debug = false
  ## Log only error level messages.
  # quiet = false

  logfile = "/var/log/telegraf/telegraf.log"
  logfile_rotation_max_size = "25MB"
  logfile_rotation_max_archives = 4

  hostname = ""
  omit_hostname = false

# Configuration for sending metrics to InfluxDB 2.0
[[outputs.influxdb_v2]]
  urls = ["http://127.0.0.1:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "org"
  bucket = "line"



[[inputs.opcua]]
  name = "opcua"
  endpoint = "opc.tcp://127.0.0.1:4840"
  connect_timeout = "300s"
  request_timeout = "10s"
  session_timeout = "5m"
  security_policy = "Basic256Sha256"
  security_mode = "SignAndEncrypt"
  certificate = ""
  private_key = ""
  auth_method = "UserName"
  username = ""
  password = ""
  timestamp = "gather"
  client_trace = false
  interval = "1000ms"
    [[inputs.opcua.group]]
      name = "Sample_DB"
      namespace = "2"
      identifier_type = "i"
      nodes = [
        {name="Real_4", identifier="5"},
        {name="Real_1", identifier="2"},
        {name="Real_3", identifier="4"},
        {name="Real_5", identifier="6"},
        {name="Real_2", identifier="3"}
      ]
    
