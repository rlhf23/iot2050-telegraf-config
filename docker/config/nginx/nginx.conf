events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

    # Docker DNS resolver - enables dynamic upstream resolution at request time
    # instead of startup time, so Nginx starts even when some services are down
    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        server_name _;

        # Root directory for static files
        root /usr/share/nginx/html;
        index index.html;

        # Main landing page
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proxy to Chronograf
        location /chronograf/ {
            set $chronograf_upstream http://chronograf:8888;
            rewrite ^/chronograf(/.*)$ $1 break;
            proxy_pass $chronograf_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Proxy to Grafana (may be unavailable in minimal profile)
        location /grafana/ {
            set $grafana_upstream http://grafana:3000;
            rewrite ^/grafana(/.*)$ $1 break;
            proxy_pass $grafana_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Grafana live features
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Proxy to InfluxDB
        location /influxdb/ {
            set $influxdb_upstream http://influxdb:8086;
            rewrite ^/influxdb(/.*)$ $1 break;
            proxy_pass $influxdb_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy to Prometheus (may be unavailable in minimal profile)
        location /prometheus/ {
            set $prometheus_upstream http://prometheus:9090;
            rewrite ^/prometheus(/.*)$ $1 break;
            proxy_pass $prometheus_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy to Telegraf metrics endpoint
        location /telegraf/ {
            set $telegraf_upstream http://telegraf:9273;
            rewrite ^/telegraf(/.*)$ $1 break;
            proxy_pass $telegraf_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # System information API endpoint (specific path, must come before /api/)
        location = /api/system-info {
            default_type application/json;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Access-Control-Allow-Origin *;
            alias /usr/share/nginx/html/system-info.json;
        }

        # Telegraf configuration file viewer (specific path, must come before /api/)
        location = /api/config/telegraf {
            default_type text/plain;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Access-Control-Allow-Origin *;
            alias /etc/telegraf/telegraf.conf;
        }

        # Proxy all other API requests to the API service (may be unavailable in minimal profile)
        location /api/ {
            set $api_upstream http://api-service:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy to Control Service API (requires auth, may be unavailable in minimal profile)
        location /api/control/ {
            auth_basic "PLC Control";
            auth_basic_user_file /etc/nginx/.htpasswd;

            set $control_upstream http://control-service:8002;
            proxy_pass $control_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Control Panel UI (requires auth)
        location = /control {
            auth_basic "PLC Control";
            auth_basic_user_file /etc/nginx/.htpasswd;

            alias /usr/share/nginx/html/control.html;
            default_type text/html;
        }

        # Health check endpoint for the landing page itself
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}