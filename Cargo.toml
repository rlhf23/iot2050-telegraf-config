[package]
name = "sie_generate_config"
version = "0.6.6"
edition = "2021"

[[bin]]
name = "sie_generate_config"
path = "src/bin/cli.rs"

[[bin]]
name = "sie_generate_config_gui"
path = "src/bin/gui.rs"

[lib]
name = "sie_generate_config"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5.4", features = ["derive", "string"] }
roxmltree = "0.20.0"
ssh2 = "0.9.4"
chrono = "0.4.38"
dotenv = "0.15.0"
colored = "2.1.0"
owo-colors = "4.0.0"

eframe = "0.22.0"  # GUI framework
rfd = "0.11.0"     # Native file dialogs
winapi = {version = "0.3.9", features = ["winuser"]}

opcua = { version = "0.12.0", features = ["console-logging"] }
tokio = { version = "1.44.0", features = ["full"] }
thiserror = "2.0.12"

[dev-dependencies]
tempfile = "3.8.0"
proptest = "1.2.0"

[build-dependencies]
dotenv = "0.15.0"

[profile.release]
opt-level = 'z'   # Optimize for size.
lto = true        # Enable Link Time Optimisation
codegen-units = 1 # Reduced to increase optimisations.
panic = 'abort'   # Abort on panic
strip = "symbols" # Strip symbols from binary
