[package]
name = "sie_generate_config"
version = "0.10.9"
edition = "2021"

[[bin]]
name = "sie_generate_config"
path = "src/bin/cli.rs"

[[bin]]
name = "sie_generate_config_gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[[bin]]
name = "opcua_test_server"
path = "src/bin/opcua_test_server.rs"

[[bin]]
name = "opcua_client_test"
path = "src/bin/opcua_client_test.rs"

[[bin]]
name = "sie_generate_config_tui"
path = "src/bin/tui.rs"
required-features = ["tui"]

[lib]
name = "sie_generate_config"
path = "src/lib.rs"

[features]
default = ["gui", "tui"]
gui = ["eframe", "rfd"]
tui = ["ratatui", "crossterm"]
vendored-openssl = ["openssl-sys/vendored"]  # Enable vendored OpenSSL for cross-compilation

[dependencies]
# Core dependencies (always included)
clap = { version = "4.5.4", features = ["derive", "string"] }
roxmltree = "0.20.0"
ssh2 = { version = "0.9", features = ["openssl-on-win32"] }
chrono = { version = "0.4.34", features = ["serde"] }
dotenv = "0.15.0"
ctrlc = "3.4"
dirs = "5.0.1"
opcua = { version = "0.12.0", features = ["console-logging"] }
thiserror = "2.0.12"
gsv-culture-ships = { version = "0.5", features = ["noncanonical"] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# OpenSSL - use vendored for easier cross-compilation
openssl-sys = { version = "0.9", optional = true }

# Optional GUI dependencies
rfd = { version = "0.15.0", optional = true }
eframe = { version = "0.31", features = [], optional = true }

# Optional TUI dependencies
ratatui = { version = "0.29.0", optional = true }
crossterm = { version = "0.28.1", optional = true }

[dev-dependencies]
tempfile = "3.8.0"
opcua = { version = "0.12.0", features = ["client"] }
scopeguard = "1.2.0"
insta = { version = "1.39.0", features = ["redactions"] }

[build-dependencies]
dotenv = "0.15.0"

[target.'cfg(windows)'.build-dependencies]
openssl = { version = "0.10", features = ["vendored"] }
winapi = {version = "0.3.9", features = ["winuser"]}

[profile.release]
opt-level = 'z'   # Optimize for size.
lto = true        # Enable Link Time Optimisation
codegen-units = 1 # Reduced to increase optimisations.
panic = 'abort'   # Abort on panic
strip = "symbols" # Strip symbols from binary
