name: SSH Connection Tests

on:
  push:
    branches: ["master", "poller"]
  pull_request:
    branches: ["master", "poller"]

env:
  CARGO_TERM_COLOR: always
  SSH_TEST_USER: "ssh_test_user"
  SSH_TEST_PASS: "testpass123"
  SSH_TEST_HOST: "127.0.0.1:22"

jobs:
  ssh-test-linux:
    name: SSH Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libssl-dev openssh-server

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Configure SSH server
        run: |
          # Generate host keys
          sudo ssh-keygen -A

          # Create test user with a home directory and bash shell
          sudo useradd -m -s /bin/bash ssh_test_user
          echo "ssh_test_user:testpass123" | sudo chpasswd

          # Restrict key exchange algorithms to mimic modern OpenSSH defaults
          # (OpenSSH 8.8+ prefers curve25519 and deprecates older DH groups).
          # This is the exact configuration that triggers KEX_FAILURE on a
          # Windows build lacking curve25519 or group-exchange support.
          sudo tee -a /etc/ssh/sshd_config > /dev/null << 'KEXCONF'

          # SSH connection test: restrict kex to modern algorithms
          KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group-exchange-sha256
          PasswordAuthentication yes
          KEXCONF

          # Start ssh (service is called "ssh" on Ubuntu, not "sshd")
          sudo systemctl start ssh || sudo systemctl start sshd

          # Wait for sshd to accept connections
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 22 2>/dev/null; then
              echo "sshd is listening on port 22"
              break
            fi
            echo "Waiting for sshd... ($i)"
            sleep 1
          done

      - name: Build
        run: cargo build --verbose
        env:
          DEFAULT_IP: "192.168.1.1"
          DEFAULT_USERNAME: "testuser"
          DEFAULT_PASSWORD: "testpass"
          DEFAULT_IOT_IP: "192.168.1.2:22"
          DEFAULT_IOT_USERNAME: "iotuser"
          DEFAULT_IOT_PASSWORD: "iotpass"
          CI: "true"

      - name: Run SSH connection tests
        run: cargo test --test ssh_connection_test --verbose
        env:
          DEFAULT_IP: "192.168.1.1"
          DEFAULT_USERNAME: "testuser"
          DEFAULT_PASSWORD: "testpass"
          DEFAULT_IOT_IP: "192.168.1.2:22"
          DEFAULT_IOT_USERNAME: "iotuser"
          DEFAULT_IOT_PASSWORD: "iotpass"
          CI: "true"
          SSH_TEST_USER: "ssh_test_user"
          SSH_TEST_PASS: "testpass123"
          SSH_TEST_HOST: "127.0.0.1:22"

      - name: Cleanup test user
        if: always()
        run: |
          sudo userdel -r ssh_test_user 2>/dev/null || true

  ssh-test-windows:
    name: SSH Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Install vcpkg and OpenSSL
        shell: pwsh
        run: |
          # Clone vcpkg
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg

          # Bootstrap vcpkg
          ./bootstrap-vcpkg.bat -disableMetrics

          # Install static OpenSSL (same as binary-release.yml)
          ./vcpkg install openssl:x64-windows-static-md

          # Set environment variables
          echo "OPENSSL_DIR=$PWD/installed/x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "OPENSSL_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "VCPKG_ROOT=$PWD" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Configure SSH server
        shell: pwsh
        run: |
          # Install OpenSSH Server (may already be present on windows-latest)
          $cap = Get-WindowsCapability -Online | Where-Object Name -like "OpenSSH.Server*"
          if ($cap.State -ne "Installed") {
            Add-WindowsCapability -Online -Name $cap.Name
          }

          # Start the SSH service
          Start-Service sshd

          # Set service to start automatically
          Set-Service -Name sshd -StartupType Automatic

          # Create test user
          net user ssh_test_user testpass123 /add
          net localgroup Administrators ssh_test_user /add

          # Configure sshd to restrict kex algorithms (mimics modern OpenSSH defaults)
          $sshdConfig = "C:\ProgramData\ssh\sshd_config"
          if (-Not (Test-Path "C:\ProgramData\ssh")) {
            New-Item -ItemType Directory -Path "C:\ProgramData\ssh" -Force
          }

          # Build the config content - use simple string concat to avoid here-string issues
          $kexConfig = ""
          $kexConfig += "# SSH connection test: restrict kex to modern algorithms`r`n"
          $kexConfig += "KexAlgorithms curve25519-sha256,diffie-hellman-group-exchange-sha256`r`n"
          $kexConfig += "PasswordAuthentication yes`r`n"

          if (Test-Path $sshdConfig) {
            $existing = Get-Content $sshdConfig -Raw
            $existing + "`r`n" + $kexConfig | Set-Content $sshdConfig -NoNewline
          } else {
            $kexConfig | Set-Content $sshdConfig -NoNewline
          }

          # Restart sshd to pick up config changes
          Restart-Service sshd

          # Wait for sshd to accept connections
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $tcp = New-Object System.Net.Sockets.TcpClient("127.0.0.1", 22)
              $tcp.Close()
              $ready = $true
              Write-Host "sshd is listening on port 22"
              break
            } catch {
              Write-Host "Waiting for sshd... ($i)"
              Start-Sleep -Seconds 1
            }
          }
          if (-not $ready) {
            Write-Error "sshd did not start within 30 seconds"
            Get-Service sshd | Format-List *
            exit 1
          }

      - name: Build
        run: cargo build --verbose
        env:
          DEFAULT_IP: "192.168.1.1"
          DEFAULT_USERNAME: "testuser"
          DEFAULT_PASSWORD: "testpass"
          DEFAULT_IOT_IP: "192.168.1.2:22"
          DEFAULT_IOT_USERNAME: "iotuser"
          DEFAULT_IOT_PASSWORD: "iotpass"

      - name: Run SSH connection tests
        run: cargo test --test ssh_connection_test --verbose
        env:
          DEFAULT_IP: "192.168.1.1"
          DEFAULT_USERNAME: "testuser"
          DEFAULT_PASSWORD: "testpass"
          DEFAULT_IOT_IP: "192.168.1.2:22"
          DEFAULT_IOT_USERNAME: "iotuser"
          DEFAULT_IOT_PASSWORD: "iotpass"
          SSH_TEST_USER: "ssh_test_user"
          SSH_TEST_PASS: "testpass123"
          SSH_TEST_HOST: "127.0.0.1:22"

      - name: Cleanup test user
        if: always()
        shell: pwsh
        run: |
          net user ssh_test_user /delete 2>$null; if ($LASTEXITCODE -ne 0) { exit 0 }