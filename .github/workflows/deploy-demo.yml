name: Deploy Demo to GitHub Pages

on:
  push:
    branches: [master, main]
    paths:
      - 'docker/config/nginx/html/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: |
          mkdir -p _site
          cp docker/config/nginx/html/index.html _site/
          cp docker/config/nginx/html/demo.js _site/
          cp docker/config/nginx/html/config-upload.html _site/
          cp docker/config/nginx/html/control.html _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4