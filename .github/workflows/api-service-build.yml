name: Build API Service Binary

on:
  # Manual trigger - run when you need to rebuild binaries
  workflow_dispatch:
  # Also run on push to these paths
  push:
    branches: [main, master, webui-config-generator]
    paths:
      - 'docker/api-service/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

jobs:
  build:
    name: Build for ${{ matrix.arch }}
    runs-on: ubuntu-22.04  # Use x86_64 runner
    strategy:
      matrix:
        include:
          # IoT2050 / Raspberry Pi (ARM64) - musl for maximum portability
          - target: aarch64-unknown-linux-musl
            arch: arm64
            needs_cross: true
          # Standard Linux servers / VMs (x86_64) - musl for maximum portability
          - target: x86_64-unknown-linux-musl
            arch: amd64
            needs_cross: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross tool
        run: cargo install cross --git https://github.com/cross-rs/cross
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build api-service with cross
        run: |
          cd docker/api-service
          cross build --release --target ${{ matrix.target }} --features vendored
        env:
          OPENSSL_STATIC: 1

      - name: Verify binary
        run: |
          ls -lh docker/api-service/target/${{ matrix.target }}/release/docker-api-service

      - name: Prepare binary for upload
        run: |
          mkdir -p artifacts
          cp docker/api-service/target/${{ matrix.target }}/release/docker-api-service \
             artifacts/docker-api-service-${{ matrix.arch }}
          chmod +x artifacts/docker-api-service-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-service-${{ matrix.arch }}
          path: artifacts/docker-api-service-${{ matrix.arch }}
          retention-days: 90

  commit-binaries:
    name: Commit updated binaries
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: api-service-arm64
          path: artifacts/arm64

      - name: Download amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: api-service-amd64
          path: artifacts/amd64

      - name: Update binaries in repo
        run: |
          cp artifacts/arm64/docker-api-service-arm64 docker/api-service/docker-api-service-arm64
          cp artifacts/amd64/docker-api-service-amd64 docker/api-service/docker-api-service-amd64
          chmod +x docker/api-service/docker-api-service-arm64
          chmod +x docker/api-service/docker-api-service-amd64

      - name: Commit and push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add docker/api-service/docker-api-service-arm64 docker/api-service/docker-api-service-amd64
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: Update pre-built api-service binaries"
          git push

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/arm64/docker-api-service-arm64
            artifacts/amd64/docker-api-service-amd64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
