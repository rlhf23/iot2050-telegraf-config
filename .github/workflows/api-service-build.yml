name: Build API Service Binary

on:
  # Manual trigger - run when you need to rebuild binaries
  workflow_dispatch:
  # Also run on push to these paths
  push:
    branches: [main, webui-config-generator]
    paths:
      - 'docker/api-service/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

jobs:
  build:
    name: Build for ARM64
    runs-on: ubuntu-latest  # Use x86_64 runner with cross-compilation
    strategy:
      matrix:
        include:
          # IoT2050 (ARM64) - use gnu instead of musl for compatibility
          - target: aarch64-unknown-linux-gnu
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        run: |
          # Enable arm64 architecture first
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          
          # Install cross-compilation toolchain
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            pkg-config \
            patchelf
          
          # Install arm64 OpenSSL development files
          sudo apt-get install -y libssl-dev:arm64
          
      - name: Set up cross-compilation environment
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> $GITHUB_ENV
          echo "OPENSSL_DIR=/usr" >> $GITHUB_ENV
          echo "OPENSSL_LIB_DIR=/usr/lib/aarch64-linux-gnu" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=/usr/include" >> $GITHUB_ENV

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build api-service
        run: |
          cd docker/api-service
          cargo build --release --target ${{ matrix.target }}

      - name: Patch binary interpreter
        run: |
          patchelf --set-interpreter /lib/ld-linux-aarch64.so.1 \
            docker/api-service/target/${{ matrix.target }}/release/docker-api-service

      - name: Strip binary
        run: |
          aarch64-linux-gnu-strip docker/api-service/target/${{ matrix.target }}/release/docker-api-service || true

      - name: Copy to expected location
        run: |
          cp docker/api-service/target/${{ matrix.target }}/release/docker-api-service \
             docker/api-service/docker-api-service
          chmod +x docker/api-service/docker-api-service

      - name: Commit binary to repo
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docker/api-service/docker-api-service
          git diff --staged --quiet || git commit -m "chore: Update aarch64 binary [skip ci]"
      
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-service-${{ matrix.arch }}
          path: docker/api-service/docker-api-service

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: docker/api-service/docker-api-service
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
