name: Build API Service Binary

on:
  # Manual trigger - run when you need to rebuild binaries
  workflow_dispatch:
  # Also run on push to these paths
  push:
    branches: [main, master, webui-config-generator]
    paths:
      - 'docker/api-service/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

jobs:
  build:
    name: Build for ${{ matrix.arch }}
    runs-on: ubuntu-latest  # Use x86_64 runner
    strategy:
      matrix:
        include:
          # IoT2050 / Raspberry Pi (ARM64)
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            needs_cross: true
          # Standard Linux servers / VMs (x86_64)
          - target: x86_64-unknown-linux-gnu
            arch: amd64
            needs_cross: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross tool (for ARM builds)
        if: matrix.needs_cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      
      - name: Install patchelf (for ARM builds)
        if: matrix.needs_cross
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build api-service (x86_64 native)
        if: ${{ !matrix.needs_cross }}
        run: |
          cd docker/api-service
          cargo build --release --target ${{ matrix.target }} --features vendored
        env:
          OPENSSL_STATIC: 1

      - name: Build api-service with cross (ARM64)
        if: matrix.needs_cross
        run: |
          cd docker/api-service
          cross build --release --target ${{ matrix.target }} --features vendored
        env:
          OPENSSL_STATIC: 1

      - name: Patch binary interpreter (ARM64 only)
        if: matrix.needs_cross
        run: |
          patchelf --set-interpreter /lib/ld-linux-aarch64.so.1 \
            docker/api-service/target/${{ matrix.target }}/release/docker-api-service

      - name: Verify binary
        run: |
          ls -lh docker/api-service/target/${{ matrix.target }}/release/docker-api-service

      - name: Prepare binary for upload
        run: |
          mkdir -p artifacts
          cp docker/api-service/target/${{ matrix.target }}/release/docker-api-service \
             artifacts/docker-api-service-${{ matrix.arch }}
          chmod +x artifacts/docker-api-service-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-service-${{ matrix.arch }}
          path: artifacts/docker-api-service-${{ matrix.arch }}
          retention-days: 90

      - name: Update binary in repo
        run: |
          cp artifacts/docker-api-service-${{ matrix.arch }} docker/api-service/docker-api-service-${{ matrix.arch }}
          chmod +x docker/api-service/docker-api-service-${{ matrix.arch }}

      - name: Commit updated binary (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docker/api-service/docker-api-service-${{ matrix.arch }}
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: Update pre-built ${{ matrix.arch }} api-service binary"

      - name: Push changes (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/docker-api-service-${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
