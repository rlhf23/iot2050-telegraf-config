name: Build API Service Binary

on:
  # Manual trigger - run when you need to rebuild binaries
  workflow_dispatch:
  # Also run on push to these paths
  push:
    branches: [main, webui-config-generator]
    paths:
      - 'docker/api-service/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

jobs:
  build:
    name: Build for ARM64
    runs-on: ubuntu-latest  # Use x86_64 runner with cross-compilation
    strategy:
      matrix:
        include:
          # IoT2050 (ARM64) - use gnu instead of musl for compatibility
          - target: aarch64-unknown-linux-gnu
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross tool
        run: cargo install cross --git https://github.com/cross-rs/cross
      
      - name: Install patchelf
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build api-service with cross
        run: |
          cd docker/api-service
          # Use cross tool with vendored OpenSSL feature
          cross build --release --target ${{ matrix.target }} --features vendored
        env:
          OPENSSL_STATIC: 1

      - name: Patch binary interpreter
        run: |
          patchelf --set-interpreter /lib/ld-linux-aarch64.so.1 \
            docker/api-service/target/${{ matrix.target }}/release/docker-api-service

      - name: Strip binary
        run: |
          # Binary is already stripped by cargo profile
          ls -lh docker/api-service/target/${{ matrix.target }}/release/docker-api-service

      - name: Prepare binary for upload
        run: |
          mkdir -p artifacts
          cp docker/api-service/target/${{ matrix.target }}/release/docker-api-service \
             artifacts/docker-api-service
          chmod +x artifacts/docker-api-service

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-service-${{ matrix.arch }}
          path: artifacts/docker-api-service
          retention-days: 90

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/docker-api-service
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
