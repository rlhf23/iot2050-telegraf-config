name: Rust

on:
  push:
    branches: [ "master", "poller"]
  pull_request:
    branches: [ "master", "poller"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libssl-dev

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # # Formatting check disabled temporarily
      # - name: Check formatting
      #   run: cargo fmt --all -- --check

      - name: Run Clippy with warning tolerance
        run: cargo clippy
        continue-on-error: true  # Allow clippy warnings for now

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose
        env:
          # Set environment variables for tests to run without actual credentials
          DEFAULT_IP: "192.168.1.1"
          DEFAULT_USERNAME: "testuser"
          DEFAULT_PASSWORD: "testpass"
          DEFAULT_IOT_IP: "192.168.1.2:22"
          DEFAULT_IOT_USERNAME: "iotuser"
          DEFAULT_IOT_PASSWORD: "iotpass"
          CI: "true"  # Ensure the CI variable is set

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          runVcpkgInstall: true
          vcpkgGitCommitId: 'a42af01b72c283e8e5c8a28c8666e139c8e2f9ea'

      - name: Install OpenSSL with vcpkg
        run: |
          vcpkg install openssl:x64-windows-static-md
          echo "OPENSSL_DIR=$env:VCPKG_ROOT/installed/x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "OPENSSL_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "VCPKGRS_DYNAMIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build for Windows
        run: cargo build --verbose
        env:
          # Set environment variables for the build
          DEFAULT_IP: "192.168.1.1"
          DEFAULT_USERNAME: "testuser"
          DEFAULT_PASSWORD: "testpass"
          DEFAULT_IOT_IP: "192.168.1.2:22"
          DEFAULT_IOT_USERNAME: "iotuser"
          DEFAULT_IOT_PASSWORD: "iotpass"

      - name: Run tests
        run: cargo test --verbose
        env:
          # Set environment variables for tests
          DEFAULT_IP: "192.168.1.1"
          DEFAULT_USERNAME: "testuser"
          DEFAULT_PASSWORD: "testpass"
          DEFAULT_IOT_IP: "192.168.1.2:22"
          DEFAULT_IOT_USERNAME: "iotuser"
          DEFAULT_IOT_PASSWORD: "iotpass"
          CI: "true"  # Ensure the CI variable is set
