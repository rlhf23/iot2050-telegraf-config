name: Windows Release Build

on:
  workflow_dispatch:  # Manual triggering from GitHub UI

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Install vcpkg and OpenSSL
        shell: pwsh
        run: |
          # Clone vcpkg
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          
          # Bootstrap vcpkg
          ./bootstrap-vcpkg.bat -disableMetrics
          
          # Install static OpenSSL (same as binary-release.yml)
          ./vcpkg install openssl:x64-windows-static-md
          
          # Set environment variables for static linking
          echo "OPENSSL_DIR=$PWD/installed/x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "OPENSSL_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "VCPKG_ROOT=$PWD" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --verbose
        env:
          DEFAULT_IP: "192.168.1.1"
          DEFAULT_USERNAME: "testuser"
          DEFAULT_PASSWORD: "testpass"
          DEFAULT_IOT_IP: "192.168.1.2:22"
          DEFAULT_IOT_USERNAME: "iotuser"
          DEFAULT_IOT_PASSWORD: "iotpass"

      - name: Run tests
        run: cargo test --verbose
        env:
          DEFAULT_IP: "192.168.1.1"
          DEFAULT_USERNAME: "testuser"
          DEFAULT_PASSWORD: "testpass"
          DEFAULT_IOT_IP: "192.168.1.2:22"
          DEFAULT_IOT_USERNAME: "iotuser"
          DEFAULT_IOT_PASSWORD: "iotpass"
          CI: "true"