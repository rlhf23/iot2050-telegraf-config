name: Monitoring Stack Test

on:
  push:
    branches: ["master", "poller"]
    paths:
      - 'docker/**'
      - '.github/workflows/monitoring-stack-test.yml'
  pull_request:
    branches: ["master", "poller"]
    paths:
      - 'docker/**'
      - '.github/workflows/monitoring-stack-test.yml'

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  validate-configs:
    name: Validate Configuration Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          echo "Validating Grafana dashboard JSON files..."
          for file in docker/config/grafana/provisioning/dashboards/*.json; do
            if [ -f "$file" ]; then
              echo "Validating $file"
              python3 -m json.tool "$file" > /dev/null || {
                echo "❌ JSON validation failed for $file"
                exit 1
              }
              echo "✅ $file is valid JSON"
            fi
          done

          echo "Validating Chronograf dashboard JSON files..."
          for file in docker/config/chronograf/dashboards/*.json; do
            if [ -f "$file" ]; then
              echo "Validating $file"
              python3 -m json.tool "$file" > /dev/null || {
                echo "❌ JSON validation failed for $file"
                exit 1
              }
              echo "✅ $file is valid JSON"
            fi
          done

      - name: Validate YAML files  
        run: |
          echo "Validating Grafana datasource YAML files..."
          # Install yq for YAML validation
          sudo snap install yq
          for file in docker/config/grafana/provisioning/datasources/*.yml docker/config/grafana/provisioning/datasources/*.yaml; do
            if [ -f "$file" ]; then
              echo "Validating $file" 
              yq eval '.' "$file" > /dev/null || {
                echo "❌ YAML validation failed for $file"
                exit 1
              }
              echo "✅ $file is valid YAML"
            fi
          done

      - name: Validate Prometheus config
        run: |
          echo "Validating Prometheus configuration..."
          if [ -f "docker/config/prometheus/prometheus.yml" ]; then
            # Use promtool via Docker to validate config
            docker run --rm -v $(pwd)/docker/config/prometheus:/etc/prometheus:ro --entrypoint=/bin/promtool prom/prometheus:latest check config /etc/prometheus/prometheus.yml || {
              echo "❌ Prometheus config validation failed"
              exit 1
            }
            echo "✅ Prometheus config is valid"
          fi

  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create test .env file for validation
        run: |
          cd docker
          # Create minimal .env file for validation
          cat > .env << EOF
          INFLUXDB_USER=test
          INFLUXDB_PASSWORD=test
          INFLUXDB_ORG=test
          INFLUXDB_BUCKET=test
          INFLUXDB_TOKEN=test
          INFLUXDB_DIAGNOSTICS_BUCKET=telegraf_diagnostics
          TELEGRAF_TOKEN=test
          GRAFANA_ADMIN_USER=test
          GRAFANA_ADMIN_PASSWORD=test
          HOST_DOCKER_GID=999
          COMPOSE_PROFILE=full
          EOF

      - name: Validate docker-compose.yml syntax
        run: |
          cd docker
          docker compose config

  test-monitoring-stack:
    name: Test Monitoring Stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate-configs, validate-compose]
    steps:
      - uses: actions/checkout@v4

      - name: Set up test environment
        run: |
          cd docker
          # Create test .env file
          cat > .env << EOF
          # Test environment variables
          INFLUXDB_USER=testadmin
          INFLUXDB_PASSWORD=testpassword123
          INFLUXDB_ORG=testorg
          INFLUXDB_BUCKET=testbucket
          INFLUXDB_TOKEN=testtoken123456789abcdef
          INFLUXDB_DIAGNOSTICS_BUCKET=telegraf_diagnostics
          TELEGRAF_TOKEN=telegraf_test_token_123
          GRAFANA_ADMIN_USER=testadmin
          GRAFANA_ADMIN_PASSWORD=testgrafana123
          HOST_DOCKER_GID=999
          COMPOSE_PROFILE=full
          EOF

      - name: Create required directories and configs
        run: |
          cd docker
          mkdir -p $HOME/telegraf
          # Use minimal config for testing if example doesn't exist
          if [ -f config/telegraf/telegraf.conf.example ]; then
            cp config/telegraf/telegraf.conf.example $HOME/telegraf/telegraf.conf
          else
            cp config/telegraf/telegraf.conf.minimal $HOME/telegraf/telegraf.conf
          fi

      - name: Start monitoring stack
        run: |
          cd docker
          # Use CI override to build api-service from source, with full profile
          docker compose --profile full -f docker-compose.yml -f docker-compose.ci.yml up -d
          echo "Waiting for services to start..."
          sleep 30

      - name: Check container status
        run: |
          cd docker
          docker compose ps
          
          # Check if all expected containers are running
          RUNNING_CONTAINERS=$(docker compose ps --services --filter "status=running" | wc -l)
          EXPECTED_CONTAINERS=8  # influxdb, telegraf, chronograf, grafana, prometheus, nginx, api-service, control-service (excludes one-shot setup containers)
          
          if [ $RUNNING_CONTAINERS -ne $EXPECTED_CONTAINERS ]; then
            echo "Expected $EXPECTED_CONTAINERS containers running, but found $RUNNING_CONTAINERS"
            docker compose logs
            exit 1
          fi

      - name: Wait for services to be healthy
        run: |
          cd docker
          echo "Waiting for services to become healthy..."
          
          # Wait up to 3 minutes for services to be healthy
          for i in {1..18}; do
            echo "Health check attempt $i/18..."
            
            # Check InfluxDB health
            if curl -f http://localhost:8086/health > /dev/null 2>&1; then
              echo "✓ InfluxDB is healthy"
              INFLUXDB_HEALTHY=true
            else
              echo "✗ InfluxDB not ready yet"
              INFLUXDB_HEALTHY=false
            fi
            
            # Check Chronograf health
            if curl -f http://localhost:8888/health > /dev/null 2>&1; then
              echo "✓ Chronograf is healthy"
              CHRONOGRAF_HEALTHY=true
            else
              echo "✗ Chronograf not ready yet"
              CHRONOGRAF_HEALTHY=false
            fi
            
            # Check Grafana health
            if curl -f http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "✓ Grafana is healthy"
              GRAFANA_HEALTHY=true
            else
              echo "✗ Grafana not ready yet"
              GRAFANA_HEALTHY=false
            fi
            
            # Check Prometheus health
            if curl -f http://localhost:9090/-/healthy > /dev/null 2>&1; then
              echo "✓ Prometheus is healthy"
              PROMETHEUS_HEALTHY=true
            else
              echo "✗ Prometheus not ready yet"
              PROMETHEUS_HEALTHY=false
            fi
            
            # Check if Telegraf is running (it doesn't have a health endpoint)
            if docker compose ps telegraf | grep -q "Up"; then
              echo "✓ Telegraf is running"
              TELEGRAF_HEALTHY=true
            else
              echo "✗ Telegraf not running"
              TELEGRAF_HEALTHY=false
            fi
            
            # Check Nginx health
            if curl -f http://localhost:80/health > /dev/null 2>&1; then
              echo "✓ Nginx is healthy"
              NGINX_HEALTHY=true
            else
              echo "✗ Nginx not ready yet"
              NGINX_HEALTHY=false
            fi
            
            # Check API Service health
            if curl -f http://localhost:8000/health > /dev/null 2>&1; then
              echo "✓ API Service is healthy"
              API_SERVICE_HEALTHY=true
            else
              echo "✗ API Service not ready yet"
              API_SERVICE_HEALTHY=false
            fi
            
            # Check Control Service health
            if curl -f http://localhost:8002/api/control/status > /dev/null 2>&1; then
              echo "✓ Control Service is healthy"
              CONTROL_SERVICE_HEALTHY=true
            else
              echo "✗ Control Service not ready yet"
              CONTROL_SERVICE_HEALTHY=false
            fi
            
            if [ "$INFLUXDB_HEALTHY" = true ] && [ "$CHRONOGRAF_HEALTHY" = true ] && [ "$GRAFANA_HEALTHY" = true ] && [ "$PROMETHEUS_HEALTHY" = true ] && [ "$TELEGRAF_HEALTHY" = true ] && [ "$NGINX_HEALTHY" = true ] && [ "$API_SERVICE_HEALTHY" = true ] && [ "$CONTROL_SERVICE_HEALTHY" = true ]; then
              echo "All services are healthy!"
              break
            fi
            
            if [ $i -eq 18 ]; then
              echo "Services failed to become healthy within timeout"
              docker compose logs
              exit 1
            fi
            
            sleep 10
          done

      - name: Test service endpoints
        run: |
          echo "Testing service endpoints..."
          
          # Test InfluxDB API
          echo "Testing InfluxDB..."
          INFLUX_RESPONSE=$(curl -s http://localhost:8086/health)
          echo "InfluxDB health response: $INFLUX_RESPONSE"
          
          # Test Chronograf API
          echo "Testing Chronograf..."
          CHRONOGRAF_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8888/health)
          echo "Chronograf health status: $CHRONOGRAF_STATUS"
          
          # Test Grafana API
          echo "Testing Grafana..."
          GRAFANA_RESPONSE=$(curl -s http://localhost:3000/api/health)
          echo "Grafana health response: $GRAFANA_RESPONSE"
          
          # Test Prometheus API
          echo "Testing Prometheus..."
          PROMETHEUS_RESPONSE=$(curl -s http://localhost:9090/-/healthy)
          echo "Prometheus health response: $PROMETHEUS_RESPONSE"
          
          # Test Telegraf metrics endpoint (if exposed)
          echo "Testing Telegraf metrics endpoint..."
          if curl -f http://localhost:9273/metrics > /dev/null 2>&1; then
            echo "✓ Telegraf metrics endpoint is accessible"
          else
            echo "ℹ Telegraf metrics endpoint not accessible (may be expected)"
          fi
          
          # Test Nginx landing page
          echo "Testing Nginx landing page..."
          if curl -f http://localhost:80/ > /dev/null 2>&1; then
            echo "✓ Landing page is accessible"
          else
            echo "✗ Landing page is not accessible"
            exit 1
          fi
          
          # Test Nginx reverse proxy paths
          echo "Testing Nginx reverse proxy paths..."
          if curl -f http://localhost:80/grafana/api/health > /dev/null 2>&1; then
            echo "✓ Grafana accessible via /grafana proxy"
          else
            echo "✗ Grafana not accessible via /grafana proxy"
            exit 1
          fi
          
          if curl -f http://localhost:80/influxdb/health > /dev/null 2>&1; then
            echo "✓ InfluxDB accessible via /influxdb proxy"
          else
            echo "✗ InfluxDB not accessible via /influxdb proxy"
            exit 1
          fi
          
          if curl -f http://localhost:80/prometheus/-/healthy > /dev/null 2>&1; then
            echo "✓ Prometheus accessible via /prometheus proxy"
          else
            echo "✗ Prometheus not accessible via /prometheus proxy"
            exit 1
          fi
          
          if curl -f http://localhost:80/chronograf/health > /dev/null 2>&1; then
            echo "✓ Chronograf accessible via /chronograf proxy"
          else
            echo "✗ Chronograf not accessible via /chronograf proxy"
          fi

      - name: Test API Service endpoints
        run: |
          echo "Testing API Service endpoints..."
          
          # Test API Service health endpoint
          echo "Testing API Service health..."
          API_HEALTH=$(curl -s http://localhost:8000/health)
          echo "API Service health response: $API_HEALTH"
          if echo "$API_HEALTH" | grep -q '"success":true'; then
            echo "✓ API Service health check passed"
          else
            echo "✗ API Service health check failed"
            exit 1
          fi
          
          # Test list containers endpoint
          echo "Testing API Service list containers..."
          CONTAINERS_LIST=$(curl -s http://localhost:8000/api/containers)
          echo "Containers list response: $CONTAINERS_LIST"
          if echo "$CONTAINERS_LIST" | grep -q '"success":true'; then
            echo "✓ API Service list containers passed"
          else
            echo "✗ API Service list containers failed"
            exit 1
          fi
          
          # Test forbidden container (should return 403)
          echo "Testing API Service security (forbidden container)..."
          FORBIDDEN_RESPONSE=$(curl -s -w "%{http_code}" -X POST http://localhost:8000/api/containers/nginx/restart)
          if echo "$FORBIDDEN_RESPONSE" | grep -q "403"; then
            echo "✓ API Service correctly blocks unauthorized containers"
          else
            echo "✗ API Service security check failed"
            exit 1
          fi
          
          # Test logs endpoint (LIVE TEST!)
          echo "Testing API Service logs functionality..."
          
          # Test fetching logs for Grafana
          echo "Fetching logs for Grafana..."
          LOGS_RESPONSE=$(curl -s http://localhost:8000/api/containers/grafana/logs)
          
          if [ -n "$LOGS_RESPONSE" ]; then
            echo "✓ API Service returned logs for Grafana"
            echo "Log preview (first 200 chars):"
            echo "$LOGS_RESPONSE" | head -c 200
            echo ""
          else
            echo "✗ API Service returned empty logs"
            exit 1
          fi
          
          # Test fetching logs for InfluxDB
          echo "Fetching logs for InfluxDB..."
          INFLUX_LOGS=$(curl -s http://localhost:8000/api/containers/influxdb/logs)
          
          if [ -n "$INFLUX_LOGS" ]; then
            echo "✓ API Service returned logs for InfluxDB"
          else
            echo "✗ API Service returned empty logs for InfluxDB"
            exit 1
          fi
          
          # Test that forbidden container logs are blocked
          echo "Testing logs security (forbidden container)..."
          FORBIDDEN_LOGS_STATUS=$(curl -s -w "%{http_code}" -o /dev/null http://localhost:8000/api/containers/nginx/logs)
          
          if [ "$FORBIDDEN_LOGS_STATUS" = "403" ]; then
            echo "✓ API Service correctly blocks unauthorized container logs"
          else
            echo "✗ API Service logs security check failed (got $FORBIDDEN_LOGS_STATUS, expected 403)"
            exit 1
          fi
          
          echo "✅ API Service logs functionality verified successfully!"

      - name: Test InfluxDB integration
        run: |
          echo "Testing InfluxDB integration..."
          
          # Wait a bit more for InfluxDB to be fully ready
          sleep 10
          
          # Test InfluxDB setup
          SETUP_STATUS=$(curl -s http://localhost:8086/api/v2/setup | jq -r '.allowed // "null"')
          echo "InfluxDB setup status: $SETUP_STATUS"
          
          # If setup is allowed, InfluxDB is not yet initialized
          if [ "$SETUP_STATUS" = "true" ]; then
            echo "InfluxDB appears to need setup, this might indicate an issue with initialization"
          else
            echo "✓ InfluxDB appears to be initialized"
          fi

      - name: Test Grafana datasource connectivity
        run: |
          echo "Testing Grafana datasource connectivity..."
          
          # Wait for Grafana to be fully ready
          sleep 15
          
          # Test Grafana login and get API key
          # Note: In a real test, we'd set up proper API authentication
          echo "Grafana should be accessible at http://localhost:3000"
          
          # Basic connectivity test
          if curl -f -u testadmin:testgrafana123 http://localhost:3000/api/org > /dev/null 2>&1; then
            echo "✓ Grafana authentication works"
          else
            echo "✗ Grafana authentication failed"
          fi

      - name: Check logs for errors
        if: always()
        run: |
          cd docker
          echo "=== InfluxDB Logs ==="
          docker compose logs influxdb | tail -50
          echo "=== Telegraf Logs ==="
          docker compose logs telegraf | tail -50
          echo "=== Chronograf Logs ==="
          docker compose logs chronograf | tail -50
          echo "=== Grafana Logs ==="
          docker compose logs grafana | tail -50
          echo "=== Prometheus Logs ==="
          docker compose logs prometheus | tail -50

      - name: Stop monitoring stack
        if: always()
        run: |
          cd docker
          docker compose down -v

  test-deployment-scripts:
    name: Test Deployment Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          echo "Running ShellCheck on all shell scripts..."
          echo "Note: This will report all issues at the end"
          
          # Create a temporary file to store errors
          SC_OUTPUT=$(mktemp)
          
          # Run shellcheck on all scripts, collect all errors
          find docker/scripts -type f -name '*.sh' | while read -r script; do
            echo "Checking $script..."
            # Run shellcheck and append to the output file
            if ! shellcheck -x -P SCRIPTDIR -e SC1091 "$script" 2>> "$SC_OUTPUT"; then
              echo "::warning file=$script::ShellCheck found issues in $script"
            fi
          done
          
          # Check if we found any errors
          if [ -s "$SC_OUTPUT" ]; then
            echo "\n=== ShellCheck Summary ==="
            cat "$SC_OUTPUT"
            echo "\n=== End of ShellCheck Summary ==="
            echo "\n❌ ShellCheck found issues - failing the build"
            exit 1
          else
            echo "\n✓ No ShellCheck issues found!"
          fi
          
          # Clean up
          rm -f "$SC_OUTPUT"

      - name: Test script syntax
        run: |
          cd docker/scripts
          
          # Check shell script syntax
          for script in *.sh; do
            echo "Checking syntax of $script..."
            bash -n "$script"
          done

      - name: Test setup.sh (dry run)
        run: |
          cd docker
          
          # Test setup script in dry-run mode
          echo "Testing setup.sh..."
          
          # Create a temporary directory for testing
          TEST_DIR=$(mktemp -d)
          cd "$TEST_DIR"
          cp -r $GITHUB_WORKSPACE/docker/* .
          
          # Mock environment for testing
          export HOME="$TEST_DIR"
          
          # Run setup script (it should create .env file)
          if ./scripts/setup.sh; then
            echo "✓ setup.sh completed successfully"
          else
            echo "✗ setup.sh failed"
            exit 1
          fi
          
          # Check if .env was created
          if [ -f .env ]; then
            echo "✓ .env file was created"
            echo "Generated .env contents:"
            cat .env
          else
            echo "✗ .env file was not created"
            exit 1
          fi

      - name: Test configuration validation
        run: |
          cd docker
          
          echo "Testing Telegraf configuration..."
          
          # Create test telegraf config
          mkdir -p $HOME/telegraf
          cp config/telegraf/telegraf.conf.example $HOME/telegraf/telegraf.conf
          
          # Test Telegraf config syntax using Docker
          if docker run --rm -v $HOME/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro telegraf:1.30 telegraf --config /etc/telegraf/telegraf.conf --test > /dev/null 2>&1; then
            echo "✓ Telegraf configuration is valid"
          else
            echo "ℹ Telegraf configuration test skipped (requires environment variables)"
          fi

  test-multi-architecture:
    name: Test Multi-Architecture Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Test ARM64 build capability
        run: |
          cd docker

          # Create test .env
          cat > .env << EOF
          INFLUXDB_USER=testadmin
          INFLUXDB_PASSWORD=testpassword123
          INFLUXDB_ORG=testorg
          INFLUXDB_BUCKET=testbucket
          INFLUXDB_TOKEN=testtoken123456789abcdef
          INFLUXDB_DIAGNOSTICS_BUCKET=telegraf_diagnostics
          TELEGRAF_TOKEN=telegraf_test_token_123
          GRAFANA_ADMIN_USER=testadmin
          GRAFANA_ADMIN_PASSWORD=testgrafana123
          HOST_DOCKER_GID=999
          COMPOSE_PROFILE=full
          EOF
          
          # Test that we can at least build for ARM64 (don't run due to emulation overhead)
          echo "Testing ARM64 build capability..."
          
          # Pull ARM64 base images to verify multi-arch support works
          docker buildx build --platform linux/arm64 --load -t test-influxdb - << EOF
          FROM influxdb:2
          RUN echo "ARM64 build test"
          EOF
          
          echo "✓ ARM64 build capability verified"
